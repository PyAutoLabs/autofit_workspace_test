# Per-script environment variable configuration for automated runs
# (smoke tests, pre-release checks, CI).
#
# "defaults" are applied to every script on top of the inherited environment.
# "overrides" selectively unset or replace vars for matching path patterns.
#
# Pattern convention (same as no_run.yaml):
#   - Patterns containing '/' do a substring match against the file path
#   - Patterns without '/' match the file stem exactly

defaults:
  PYAUTO_TEST_MODE: "2"                     # 0=normal, 1=reduced iterations, 2=skip sampler (fastest)
  PYAUTO_SMALL_DATASETS: "1"                # Cap grids/masks to 15x15, reduce MGE gaussians
  PYAUTO_DISABLE_JAX: "1"                   # Force use_jax=False, avoid JIT compilation overhead
  PYAUTO_FAST_PLOTS: "1"                    # Skip tight_layout() + critical curve/caustic overlays
  PYAUTO_SKIP_WORKSPACE_VERSION_CHECK: "1"  # profile-owned so the base-env scrub (#161 step 3) cannot drop the mega-run's CI injection
  JAX_ENABLE_X64: "True"                    # Enable 64-bit precision in JAX
  NUMBA_CACHE_DIR: "/tmp/numba_cache"       # Writable cache dir for numba
  MPLCONFIGDIR: "/tmp/matplotlib"           # Writable config dir for matplotlib

overrides:
  # Aggregator / database / minimal-output scripts assert `len(agg) > 0`.
  # They need a real sampler run; PYAUTO_TEST_MODE=2 would bypass the
  # sampler and leave the aggregator empty, failing the assertion.
  - pattern: "database/directory/general"
    unset: [PYAUTO_TEST_MODE]
  - pattern: "database/directory/multi_analysis"
    unset: [PYAUTO_TEST_MODE]
  - pattern: "database/scrape/general"
    unset: [PYAUTO_TEST_MODE]
  - pattern: "database/scrape/multi_analysis"
    unset: [PYAUTO_TEST_MODE]
  - pattern: "features/minimal_output"
    unset: [PYAUTO_TEST_MODE]
  # Model assertion scripts define inequality constraints between parameters
  # (e.g. gaussian_0.centre > gaussian_1.centre). Bypass mode (TEST_MODE=2)
  # uses a midpoint unit vector so both parameters get identical values,
  # violating the assertion and raising FitException before the likelihood
  # is called. Use TEST_MODE=1 (reduced iterations, real sampler) — the
  # library's compute_latent_samples now tolerates per-sample FitException,
  # so assertion-violating posterior samples are skipped rather than
  # crashing the post-fit updater.
  - pattern: "features/assertion"
    set:
      PYAUTO_TEST_MODE: "1"
  # JAX assertion scripts exist specifically to test JAX behavior — disabling
  # JAX makes their assertions vacuous (Analysis._use_jax_for_visualization is
  # silently flipped to False, so cached attrs like _jitted_fit_from never get
  # set, and downstream assertions about those attrs hit __getattr__).
  - pattern: "jax_assertions/"
    unset: [PYAUTO_DISABLE_JAX]
  # BlackJAXNUTS is a gradient-based MCMC that requires JAX (jax.grad of the
  # autofit Fitness). Under PYAUTO_TEST_MODE=2 the sampler is bypassed and
  # returns the prior midpoint — the script's truth-recovery assertions
  # (centre ≈ 50, normalization ≈ 25, sigma ≈ 10) then fail because the
  # LogUniformPrior's log-midpoint is 1.0, not 25.0. Run with full sampler
  # at the script's already-cheap defaults (num_warmup=200, num_samples=500).
  - pattern: "searches/BlackJAXNUTS"
    unset: [PYAUTO_TEST_MODE, PYAUTO_DISABLE_JAX]
  # MultiStartAdam is a JAX-native gradient MAP search that hard-raises when the
  # analysis is not on the JAX backend. Under this profile's defaults it never
  # reaches that guard: PYAUTO_TEST_MODE=2 bypasses the sampler before `_fit`
  # runs, so the script passes without executing its JAX path at all — the
  # backend regression it exists to catch went unnoticed here and surfaced only
  # under mode=release. Run it for real (a jitted 3-parameter fit, ~6s) so the
  # weekly mode=smoke workspace-validation sweep, which runs every script under
  # this profile, actually exercises it. Note this profile does NOT feed the
  # per-PR gate — that is the curated smoke_tests.txt list, which contains
  # neither this script nor BlackJAXNUTS.
  - pattern: "searches/MultiStartAdam"
    unset: [PYAUTO_TEST_MODE, PYAUTO_DISABLE_JAX]
