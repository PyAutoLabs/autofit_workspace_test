# Per-script environment variable configuration for automated runs
# (smoke tests, pre-release checks, CI).
#
# "defaults" are applied to every script on top of the inherited environment.
# "overrides" selectively unset or replace vars for matching path patterns.
#
# Pattern convention (same as no_run.yaml):
#   - Patterns containing '/' do a substring match against the file path
#   - Patterns without '/' match the file stem exactly

defaults:
  PYAUTO_TEST_MODE: "2"                     # 0=normal, 1=reduced iterations, 2=skip sampler (fastest)
  PYAUTO_DISABLE_JAX: "1"                   # Force use_jax=False, avoid JIT compilation overhead
  PYAUTO_SKIP_WORKSPACE_VERSION_CHECK: "1"  # profile-owned so the base-env scrub (#161 step 3) cannot drop the mega-run's CI injection
  JAX_ENABLE_X64: "True"                    # Enable 64-bit precision in JAX
  NUMBA_CACHE_DIR: "/tmp/numba_cache"       # Writable cache dir for numba
  MPLCONFIGDIR: "/tmp/matplotlib"           # Writable config dir for matplotlib

overrides:
  # Migrated to in-file `# ENV: real_search` declarations on each matched
  # script (database/*, features/minimal_output) — #187 Stage 2.
  # Model assertion scripts define inequality constraints between parameters
  # (e.g. gaussian_0.centre > gaussian_1.centre). Bypass mode (TEST_MODE=2)
  # uses a midpoint unit vector so both parameters get identical values,
  # violating the assertion and raising FitException before the likelihood
  # is called. Use TEST_MODE=1 (reduced iterations, real sampler) — the
  # library's compute_latent_samples now tolerates per-sample FitException,
  # so assertion-violating posterior samples are skipped rather than
  # crashing the post-fit updater.
  - pattern: "features/assertion"
    set:
      PYAUTO_TEST_MODE: "1"
  # jax_assertions/, searches/BlackJAXNUTS and searches/MultiStartAdam migrated
  # to in-file `# ENV:` declarations (jax / real_search jax) — #187 Stage 2.
  # graphical/analytic_gaussian.py declares `real_search`, so its graphical
  # column runs two real DynestyStatic searches, and the in-run status record
  # renders anesthetic corner plots for each of them. The script asserts a
  # numeric parity table (53 cells); no cell reads a plot, and search
  # visualization is covered by scripts/searches/*. Skipping the plots keeps
  # every assertion and its tolerance unchanged. Measured locally on py3.12:
  # 44.5s -> 27.1s, PARITY: PASS (53/53) both ways.
  - pattern: "graphical/analytic_gaussian.py"
    set:
      PYAUTO_SKIP_VISUALIZATION: "1"
